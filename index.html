<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlidePrep 课前通 - 智能课件预习与标注</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #f8fafc; /* Slate 50 */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Highlight classes */
        .term-highlight {
            border-bottom: 2px dashed #8b5cf6;
            background-color: rgba(139, 92, 246, 0.1);
            cursor: pointer;
            border-radius: 2px;
            padding: 0 2px;
            transition: all 0.2s;
        }
        .term-highlight:hover {
            background-color: rgba(139, 92, 246, 0.25);
        }

        /* 3D Flashcard */
        .flashcard-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .flashcard-back {
            transform: rotateY(180deg);
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Toast Animation */
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-enter { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 z-20 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-violet-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">
                <i class="ph-bold ph-graduation-cap"></i>
            </div>
            <h1 class="text-lg font-bold text-slate-800 tracking-tight hidden sm:block">SlidePrep <span class="font-normal text-slate-500 text-sm">课前通</span></h1>
        </div>
        
        <div class="flex-1 max-w-xl mx-4 flex items-center justify-center">
            <div id="status-bar" class="text-sm font-medium text-slate-500 flex items-center gap-2 px-3 py-1.5 bg-slate-100 rounded-full">
                <i class="ph ph-info"></i> 请导入 PDF 课件或图片开始预习
            </div>
        </div>

        <div class="flex items-center gap-3">
            <label class="cursor-pointer bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-1.5 px-4 rounded-full transition-colors flex items-center gap-2 shadow-sm">
                <i class="ph-bold ph-upload-simple"></i>
                <span class="hidden sm:inline">导入 PDF / 图片</span>
                <input type="file" id="file-upload" class="hidden" accept=".pdf,image/png,image/jpeg,image/webp" multiple>
            </label>
            <button onclick="toggleSettings()" class="w-8 h-8 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                <i class="ph-bold ph-gear text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <aside class="w-20 sm:w-64 bg-white border-r border-slate-200 flex flex-col h-full shrink-0">
            <div class="p-3 border-b border-slate-100 text-xs font-semibold text-slate-400 uppercase tracking-wider hidden sm:block">
                课件大纲 (Slides)
            </div>
            <div id="slide-list" class="flex-1 overflow-y-auto p-2 space-y-2">
                <!-- Slides will be injected here -->
            </div>
        </aside>

        <section class="flex-1 flex flex-col h-full bg-slate-50 relative overflow-hidden">
            <!-- Header for current slide -->
            <div class="h-12 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-4 absolute top-0 w-full z-10">
                <div class="flex gap-2 text-slate-500 text-sm">
                    <button onclick="prevSlide()" class="hover:text-slate-800 flex items-center gap-1"><i class="ph-bold ph-caret-left"></i> 上一页</button>
                    <span id="page-indicator" class="font-medium text-slate-700">0 / 0</span>
                    <button onclick="nextSlide()" class="hover:text-slate-800 flex items-center gap-1">下一页 <i class="ph-bold ph-caret-right"></i></button>
                </div>
                <div class="flex gap-3">
                    <button onclick="speakSlideText()" class="text-sm flex items-center gap-1 text-slate-500 hover:text-violet-600 transition-colors">
                        <i class="ph-bold ph-speaker-high"></i> 朗读本页
                    </button>
                </div>
            </div>

            <!-- Slide Content Scroll Area -->
            <div id="slide-content-area" class="flex-1 overflow-y-auto pt-16 pb-8 px-4 sm:px-8 flex flex-col items-center">
                
                <!-- Image Viewer -->
                <div class="w-full max-w-4xl bg-white shadow-sm rounded-xl overflow-hidden border border-slate-200 mb-6 flex justify-center">
                    <img id="current-slide-img" src="" class="max-w-full h-auto object-contain hidden" style="max-height: 60vh;" alt="Slide Image">
                    <div id="slide-placeholder" class="w-full h-64 flex flex-col items-center justify-center text-slate-400 bg-slate-50">
                        <i class="ph-duotone ph-file-pdf text-4xl mb-2"></i>
                        <p class="text-sm">尚未导入内容</p>
                    </div>
                </div>

                <!-- Text Content & OCR Results -->
                <div class="w-full max-w-4xl bg-white shadow-sm rounded-xl border border-slate-200 p-6 sm:p-8">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="ph-duotone ph-text-aa text-violet-600 text-xl"></i> 原文解析与识别
                    </h2>
                    <div id="slide-text" class="text-slate-600 leading-relaxed text-[15px] space-y-4">
                        请从上方任务栏上传 PDF 或图片，系统将自动识别内容。
                    </div>
                </div>
            </div>
        </section>

        <aside class="w-full sm:w-80 bg-white border-l border-slate-200 flex flex-col h-full absolute sm:relative right-0 transform translate-x-full sm:translate-x-0 transition-transform z-30" id="right-sidebar">
            <!-- Mobile Close Button -->
            <button onclick="toggleMobileSidebar()" class="sm:hidden absolute -left-10 top-20 bg-white p-2 rounded-l-lg shadow-md border border-r-0 border-slate-200">
                <i class="ph-bold ph-caret-left text-slate-600"></i>
            </button>

            <!-- Tabs -->
            <div class="flex border-b border-slate-200 px-2 pt-2 gap-1 shrink-0 bg-slate-50">
                <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn flex-1 pb-2 text-sm font-medium border-b-2 border-violet-600 text-violet-700">词汇 (<span id="vocab-count">0</span>)</button>
                <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn flex-1 pb-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700">背词卡</button>
                <button onclick="switchTab('chat')" id="tab-btn-chat" class="tab-btn flex-1 pb-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700">AI助教</button>
            </div>

            <!-- Tab Content Area -->
            <div class="flex-1 overflow-y-auto p-4 bg-slate-50/50">
                
                <!-- Vocab Tab -->
                <div id="tab-vocab" class="space-y-3">
                    <div id="vocab-list" class="text-sm text-slate-500 text-center mt-10">
                        正在等待内容分析...
                    </div>
                </div>

                <!-- Flashcard Tab -->
                <div id="tab-flashcard" class="hidden h-full flex flex-col items-center justify-center">
                    <div id="flashcard-container" class="w-full aspect-[4/3] relative perspective-1000 hidden cursor-pointer" onclick="flipCard()">
                        <div class="flashcard w-full h-full relative flashcard-inner">
                            <!-- Front -->
                            <div class="flashcard-front bg-white border-2 border-violet-100 rounded-2xl shadow-sm flex flex-col items-center justify-center p-6 text-center">
                                <span class="text-xs font-semibold text-violet-500 uppercase tracking-widest mb-4">Click to flip</span>
                                <h3 id="fc-word" class="text-3xl font-bold text-slate-800 mb-2">Word</h3>
                                <p id="fc-phonetic" class="text-slate-500 font-mono">/wɜːrd/</p>
                            </div>
                            <!-- Back -->
                            <div class="flashcard-back bg-violet-600 rounded-2xl shadow-sm flex flex-col items-center justify-center p-6 text-center text-white">
                                <h3 id="fc-translation" class="text-2xl font-bold mb-4">翻译</h3>
                                <p id="fc-context" class="text-sm text-violet-100 italic">"Context sentence goes here."</p>
                            </div>
                        </div>
                    </div>
                    <div id="fc-controls" class="flex gap-4 mt-6 hidden">
                        <button onclick="prevCard()" class="p-2 rounded-full bg-white shadow hover:bg-slate-50 text-slate-600"><i class="ph-bold ph-arrow-left"></i></button>
                        <span id="fc-indicator" class="flex items-center text-sm font-medium text-slate-500">1 / 1</span>
                        <button onclick="nextCard()" class="p-2 rounded-full bg-white shadow hover:bg-slate-50 text-slate-600"><i class="ph-bold ph-arrow-right"></i></button>
                    </div>
                    <div id="fc-empty" class="text-sm text-slate-500 text-center">当前页面暂无提取的专业词汇</div>
                </div>

                <!-- Chat Tab -->
                <div id="tab-chat" class="hidden h-full flex flex-col">
                    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 mb-4 text-sm">
                        <div class="bg-violet-50 border border-violet-100 rounded-lg p-3 text-violet-800">
                            👋 我是你的 AI 助教。关于当前页面的公式、概念或翻译有任何疑问，随时问我！
                        </div>
                    </div>
                    <div class="shrink-0 relative">
                        <input type="text" id="chat-input" placeholder="输入问题，按回车发送..." class="w-full bg-white border border-slate-300 rounded-lg pl-3 pr-10 py-2.5 text-sm focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500" onkeypress="handleChatEnter(event)">
                        <button onclick="sendChatMessage()" class="absolute right-2 top-2 text-violet-600 hover:text-violet-800 p-1">
                            <i class="ph-bold ph-paper-plane-right"></i>
                        </button>
                    </div>
                </div>

            </div>
        </aside>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="ph-duotone ph-gear text-violet-600"></i> 系统设置
                </h3>
                <button onclick="toggleSettings()" class="text-slate-400 hover:text-slate-600"><i class="ph-bold ph-x"></i></button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Gemini API Key</label>
                    <input type="password" id="api-key-input" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-violet-500" placeholder="AIzaSy...">
                    <p class="text-xs text-slate-500 mt-2">用于提供 AI 解析、标注与答疑功能。<a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-violet-600 hover:underline">获取免费Key</a></p>
                </div>
            </div>
            
            <div class="mt-8 flex justify-end gap-3">
                <button onclick="toggleSettings()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button onclick="saveSettings()" class="px-4 py-2 text-sm font-medium text-white bg-violet-600 hover:bg-violet-700 rounded-lg">保存设置</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2"></div>

    <script>
        // Set up PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // App State
        let slides = []; // { id, imageUrl, text, status: 'pending'|'processing'|'done', vocab: [], aiSummary: '' }
        let currentSlideIndex = -1;
        let apiKey = localStorage.getItem('slideprep_gemini_key') || '';
        let flashcardIndex = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if(!apiKey) {
                showToast('请在设置中配置 Gemini API Key 以启用 AI 功能', 'warning');
            }
        });

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800';
            let icon = 'ph-info';
            if(type === 'success') { bgClass = 'bg-emerald-600'; icon = 'ph-check-circle'; }
            if(type === 'error') { bgClass = 'bg-red-600'; icon = 'ph-warning-circle'; }
            if(type === 'warning') { bgClass = 'bg-amber-500'; icon = 'ph-warning'; }

            toast.className = `${bgClass} text-white px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2 toast-enter`;
            toast.innerHTML = `<i class="ph-bold ${icon} text-lg"></i> ${message}`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%)';
                toast.style.transition = 'all 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Settings Logic
        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            if(modal.classList.contains('hidden')) {
                document.getElementById('api-key-input').value = apiKey;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }
        function saveSettings() {
            const key = document.getElementById('api-key-input').value.trim();
            if(key) {
                apiKey = key;
                localStorage.setItem('slideprep_gemini_key', apiKey);
                showToast('设置已保存', 'success');
                toggleSettings();
                // Trigger analysis on current slide if it was pending due to no key
                if(currentSlideIndex >= 0 && slides[currentSlideIndex].status === 'pending') {
                    triggerAutoAnnotation(currentSlideIndex);
                }
            } else {
                showToast('API Key 不能为空', 'error');
            }
        }

        // UI Tab Switching
        function switchTab(tabName) {
            ['vocab', 'flashcard', 'chat'].forEach(name => {
                document.getElementById(`tab-${name}`).classList.add('hidden');
                const btn = document.getElementById(`tab-btn-${name}`);
                btn.classList.remove('border-violet-600', 'text-violet-700');
                btn.classList.add('border-transparent', 'text-slate-500');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-btn-${tabName}`);
            activeBtn.classList.remove('border-transparent', 'text-slate-500');
            activeBtn.classList.add('border-violet-600', 'text-violet-700');

            if(tabName === 'flashcard') updateFlashcardUI();
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('right-sidebar');
            sidebar.classList.toggle('translate-x-full');
        }

        function updateStatusBar(msg, isLoading = false) {
            const bar = document.getElementById('status-bar');
            bar.innerHTML = isLoading 
                ? `<div class="loader mr-2 w-4 h-4 border-2"></div> ${msg}`
                : `<i class="ph-bold ph-info text-violet-600"></i> ${msg}`;
        }

        document.getElementById('file-upload').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            slides = [];
            currentSlideIndex = -1;
            updateStatusBar('正在解析文件，请稍候...', true);
            
            for (const file of files) {
                if (file.type === 'application/pdf') {
                    await parsePDF(file);
                } else if (file.type.startsWith('image/')) {
                    await parseImage(file);
                } else {
                    showToast(`不支持的文件格式: ${file.name} (请上传PDF或图片)`, 'error');
                }
            }
            
            if (slides.length > 0) {
                renderSlideList();
                goToSlide(0);
                showToast('文件导入成功！', 'success');
                updateStatusBar('解析完成，AI正在后台静默标注中...');
            } else {
                updateStatusBar('文件解析失败');
            }
        });

        async function parsePDF(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const text = textContent.items.map(item => item.str).join(' ').trim();
                    
                    // Optimized canvas rendering for faster load and smaller payload
                    const viewport = page.getViewport({ scale: 1.0 }); // 降低缩放率
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    // Compress image heavily
                    const imageUrl = canvas.toDataURL('image/jpeg', 0.6);
                    
                    slides.push({
                        id: `pdf-${file.name}-page-${i}`,
                        title: `Page ${i}`,
                        imageUrl: imageUrl,
                        text: text,
                        status: 'pending',
                        vocab: [],
                        aiSummary: ''
                    });
                }
            } catch (error) {
                console.error("PDF Parsing error:", error);
                showToast('读取 PDF 失败', 'error');
            }
        }

        function parseImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    slides.push({
                        id: `img-${file.name}-${Date.now()}`,
                        title: file.name,
                        imageUrl: e.target.result,
                        text: '', // Images rely on Vision AI OCR
                        status: 'pending',
                        vocab: [],
                        aiSummary: ''
                    });
                    resolve();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderSlideList() {
            const list = document.getElementById('slide-list');
            list.innerHTML = slides.map((slide, index) => `
                <div onclick="goToSlide(${index})" class="group cursor-pointer rounded-lg border-2 ${index === currentSlideIndex ? 'border-violet-500 bg-violet-50' : 'border-transparent hover:bg-slate-100'} p-2 transition-all">
                    <div class="aspect-[4/3] bg-slate-200 rounded overflow-hidden mb-1 relative">
                        <img src="${slide.imageUrl}" class="w-full h-full object-cover">
                        ${slide.status === 'done' ? '<div class="absolute bottom-1 right-1 bg-emerald-500 text-white text-[10px] px-1 rounded flex items-center gap-1"><i class="ph-bold ph-check"></i>已标</div>' : ''}
                        ${slide.status === 'processing' ? '<div class="absolute bottom-1 right-1 bg-amber-500 text-white text-[10px] px-1 rounded"><i class="ph-bold ph-spinner animate-spin"></i></div>' : ''}
                    </div>
                    <div class="text-[11px] font-medium text-slate-600 text-center truncate sm:text-left">${index + 1}. ${slide.title}</div>
                </div>
            `).join('');
        }

        function goToSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentSlideIndex = index;
            
            const slide = slides[currentSlideIndex];
            
            // Update UI
            document.getElementById('slide-placeholder').classList.add('hidden');
            const imgEl = document.getElementById('current-slide-img');
            imgEl.src = slide.imageUrl;
            imgEl.classList.remove('hidden');
            document.getElementById('page-indicator').innerText = `${currentSlideIndex + 1} / ${slides.length}`;
            
            renderSlideList(); // Update highlight in sidebar
            
            // Render Text/Vocab area based on status
            if(slide.status === 'done') {
                updateSlideTextUI(slide);
                renderVocabTab(slide);
                updateStatusBar(`第 ${index + 1} 页分析完成`);
            } else if (slide.status === 'processing') {
                document.getElementById('slide-text').innerHTML = '<div class="text-slate-400 flex items-center gap-2"><div class="loader"></div> AI 正在深度分析提取本页词汇...</div>';
                document.getElementById('vocab-list').innerHTML = '<div class="text-center text-slate-400">分析中...</div>';
            } else {
                // Pending - Auto trigger
                document.getElementById('slide-text').innerText = slide.text || "准备使用 AI 识别图片内容...";
                document.getElementById('vocab-list').innerHTML = '<div class="text-center text-slate-400">等待分析...</div>';
                triggerAutoAnnotation(currentSlideIndex);
            }

            flashcardIndex = 0;
            updateFlashcardUI();
            
            // Clear chat for new slide
            document.getElementById('chat-messages').innerHTML = `
                <div class="bg-violet-50 border border-violet-100 rounded-lg p-3 text-violet-800">
                    👋 针对第 ${index + 1} 页，你有什么疑问吗？
                </div>`;
        }

        function prevSlide() { goToSlide(currentSlideIndex - 1); }
        function nextSlide() { goToSlide(currentSlideIndex + 1); }

        async function triggerAutoAnnotation(index) {
            const slide = slides[index];
            if (!apiKey) {
                updateStatusBar('等待 API Key 配置以启动分析');
                return;
            }
            if (slide.status !== 'pending') return;
            
            slide.status = 'processing';
            renderSlideList();
            goToSlide(index); // Refresh UI to show loading
            updateStatusBar('AI 正在提取专业词汇与公式...');

            try {
                // Highly Optimized Payload
                const parts = [];
                // Include text if available
                if (slide.text && slide.text.trim().length > 0) {
                    parts.push({ text: `Content:\n${slide.text}` });
                }

                // MULTIMODAL OPTIMIZATION: Only send image if text is sparse (e.g. pure image or scanned PDF)
                // This saves massive amount of data transfer and API processing time.
                const hasEnoughText = slide.text.trim().length > 100;
                if (!hasEnoughText && slide.imageUrl.startsWith('data:image')) {
                    const base64Data = slide.imageUrl.split(',')[1];
                    const mimeType = slide.imageUrl.split(';')[0].split(':')[1];
                    parts.push({ inlineData: { mimeType: mimeType, data: base64Data } });
                }

                const systemPrompt = `You are a university academic assistant. Analyze the slide content/image.
1. Extract 3-8 key professional academic vocabulary words or phrases (English for Specific Purposes).
2. For each, provide its exact phonetic symbol, Chinese translation in this academic context, and a short English example sentence derived from or relevant to the slide.
3. If the slide contains Math or Chemistry formulas, extract them cleanly using standard LaTeX format (e.g., $$E=mc^2$$) to prevent garbled OCR text.
4. Output strictly in JSON format:
{
  "cleaned_text": "The full readable text of the slide. Use LaTeX for math/chem.",
  "vocab": [
    {"word": "Resilience", "phonetic": "/rɪˈzɪliəns/", "translation": "韧性/恢复力", "context": "build organizational resilience", "level": "Hard"}
  ]
}`;

                const requestBody = {
                    contents: [{ parts: parts }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                const data = await response.json();
                let jsonText = data.candidates[0].content.parts[0].text;
                // Clean potential markdown blocks
                if (jsonText.startsWith('```json')) {
                    jsonText = jsonText.replace(/^```json/, '').replace(/```$/, '').trim();
                }
                const result = JSON.parse(jsonText);

                slide.text = result.cleaned_text || slide.text; // Prefer AI cleaned text with LaTeX
                slide.vocab = result.vocab || [];
                slide.status = 'done';

            } catch (error) {
                console.error("AI Annotation Error:", error);
                slide.status = 'pending'; // Allow retry
                showToast(`页面 ${index+1} 标注失败, 请检查网络或 API Key`, 'error');
            }

            // Update UI if we are still on this slide
            if (currentSlideIndex === index) {
                goToSlide(index);
            } else {
                renderSlideList(); // Update background status badge
            }
        }

        function updateSlideTextUI(slide) {
            let htmlText = slide.text;
            // 1. Highlight Vocab
            if (slide.vocab && slide.vocab.length > 0) {
                slide.vocab.forEach(v => {
                    const regex = new RegExp(`(${v.word})`, 'gi');
                    htmlText = htmlText.replace(regex, `<span class="term-highlight" onclick="highlightClick('${v.word}')" title="${v.translation}">$1</span>`);
                });
            }
            // 2. Formatting newlines
            htmlText = htmlText.replace(/\n/g, '<br/>');
            
            const container = document.getElementById('slide-text');
            container.innerHTML = htmlText;
            
            // 3. Render Math/Chem with KaTeX
            renderMathInElement(container, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
            });
        }

        function renderVocabTab(slide) {
            document.getElementById('vocab-count').innerText = slide.vocab ? slide.vocab.length : 0;
            const container = document.getElementById('vocab-list');
            
            if (!slide.vocab || slide.vocab.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 py-10">未检测到高频专业词汇</div>';
                return;
            }

            container.innerHTML = slide.vocab.map(v => `
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm hover:shadow transition-shadow">
                    <div class="flex justify-between items-start mb-1">
                        <div>
                            <span class="font-bold text-slate-800 text-base">${v.word}</span>
                            <span class="text-xs text-slate-400 font-mono ml-2">${v.phonetic}</span>
                        </div>
                        <button onclick="speakText('${v.word.replace(/'/g, "\\'")}')" class="text-violet-500 hover:text-violet-700 bg-violet-50 p-1 rounded">
                            <i class="ph-bold ph-speaker-high"></i>
                        </button>
                    </div>
                    <div class="text-[13px] font-medium text-violet-700 mb-2">${v.translation}</div>
                    <div class="text-xs text-slate-500 italic border-l-2 border-slate-200 pl-2">"${v.context}"</div>
                </div>
            `).join('');
        }

        function highlightClick(word) {
            switchTab('vocab');
            // Auto open right sidebar on mobile
            const sidebar = document.getElementById('right-sidebar');
            if (sidebar.classList.contains('translate-x-full')) {
                toggleMobileSidebar();
            }
        }

        function updateFlashcardUI() {
            const slide = slides[currentSlideIndex];
            const container = document.getElementById('flashcard-container');
            const controls = document.getElementById('fc-controls');
            const emptyState = document.getElementById('fc-empty');

            // Reset flip state
            const fc = document.querySelector('.flashcard');
            if(fc) fc.classList.remove('flipped');

            if (!slide || !slide.vocab || slide.vocab.length === 0) {
                container.classList.add('hidden');
                controls.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            controls.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const wordData = slide.vocab[flashcardIndex];
            document.getElementById('fc-word').innerText = wordData.word;
            document.getElementById('fc-phonetic').innerText = wordData.phonetic;
            document.getElementById('fc-translation').innerText = wordData.translation;
            document.getElementById('fc-context').innerText = `"${wordData.context}"`;
            
            document.getElementById('fc-indicator').innerText = `${flashcardIndex + 1} / ${slide.vocab.length}`;
        }

        function flipCard() {
            document.querySelector('.flashcard').classList.toggle('flipped');
        }
        function prevCard() {
            if (!slides[currentSlideIndex].vocab) return;
            if (flashcardIndex > 0) flashcardIndex--;
            updateFlashcardUI();
        }
        function nextCard() {
            const vocab = slides[currentSlideIndex].vocab;
            if (!vocab) return;
            if (flashcardIndex < vocab.length - 1) flashcardIndex++;
            updateFlashcardUI();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                showToast('你的浏览器不支持语音朗读', 'error');
            }
        }

        function speakSlideText() {
            if (currentSlideIndex >= 0 && slides[currentSlideIndex].text) {
                // Strip html/markdown for speaking
                let cleanText = slides[currentSlideIndex].text.replace(/<[^>]+>/g, '').replace(/[\$\\]/g, '');
                speakText(cleanText);
            }
        }

        function handleChatEnter(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        async function sendChatMessage() {
            const inputEl = document.getElementById('chat-input');
            const message = inputEl.value.trim();
            if (!message) return;
            if (!apiKey) {
                showToast('请先配置 API Key', 'warning');
                toggleSettings();
                return;
            }
            if (currentSlideIndex < 0) {
                showToast('请先导入并选择一页课件', 'warning');
                return;
            }

            const chatContainer = document.getElementById('chat-messages');
            
            // Append User Message
            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-slate-800 text-white rounded-lg p-2.5 max-w-[85%]">${message}</div>
                </div>`;
            inputEl.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading indicator
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-violet-50 text-violet-500 rounded-lg p-2.5 max-w-[85%] flex items-center gap-2">
                        <div class="loader w-3 h-3 border-2 border-violet-300 border-t-violet-600"></div> 思考中...
                    </div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const slide = slides[currentSlideIndex];
                const contextText = slide.text || 'Image only slide';
                const prompt = `Based on the following slide content context:\n"""\n${contextText}\n"""\n\nStudent asks: ${message}\nAnswer concisely and professionally. If explaining math/chem, use standard LaTeX ($...$ or $$...$$). Use Chinese for the explanation mostly.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) throw new Error('Chat API failed');
                const data = await response.json();
                const aiReply = data.candidates[0].content.parts[0].text;

                document.getElementById(loadingId).remove();
                
                // Parse markdown and render KaTeX
                const parsedHTML = marked.parse(aiReply);
                
                const replyDiv = document.createElement('div');
                replyDiv.className = "flex justify-start";
                replyDiv.innerHTML = `<div class="bg-white border border-slate-200 text-slate-700 rounded-lg p-3 max-w-[95%] prose prose-sm prose-violet">${parsedHTML}</div>`;
                
                chatContainer.appendChild(replyDiv);
                
                // Apply KaTeX to the newly added message
                renderMathInElement(replyDiv, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });

                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `
                <div class="flex justify-start">
                    <div class="bg-red-50 text-red-600 border border-red-100 rounded-lg p-2.5 max-w-[85%]">
                        <i class="ph-bold ph-warning-circle"></i> 请求失败，请检查网络或 API Key。
                    </div>
                </div>`;
            }
        }
    </script>
</body>
</html>
